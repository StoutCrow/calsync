name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Shell script syntax
        if: runner.os == 'Linux'
        run: bash -n install-server.sh && bash -n start-calsync.sh
      - name: Secrets must not be in the repo
        if: runner.os == 'Linux'
        run: |
          ! git ls-files | grep -E '(^|/)calsync\.env$|\.log$|^window/|^lib/'