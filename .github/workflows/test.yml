name: tests
on: [push, pull_request]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: docker compose -f docker-compose.yml config -q && docker compose -f docker-compose.yml -f docker-compose.immich.yml config -q
      - name: Build the image and start it (demo mode, no keys)
        run: |
          docker build -t calsync:ci .
          docker run -d --name cs -p 127.0.0.1:8766:8766 calsync:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8766/ | grep -q "<title>calsync"
          # the API must refuse a request that has no access code
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8766/api/status)" = "403"
          docker logs cs
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Shell script syntax
        if: runner.os == 'Linux'
        run: bash -n install-server.sh && bash -n start-calsync.sh
      - name: Secrets must not be in the repo
        if: runner.os == 'Linux'
        run: |
          ! git ls-files | grep -E '(^|/)calsync\.env$|\.log$|^window/|^lib/'